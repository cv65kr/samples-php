version: "3"

rpc:
  listen: tcp://127.0.0.1:6001

server:
  command: "php worker.php"

temporal:
  address: ${TEMPORAL_HOST:-localhost}:${TEMPORAL_PORT:-7233}
  cache_size: 15000
  activities:
    allocate_timeout: 172800s
    num_workers: 8
    supervisor:
      max_worker_memory: 160

logs:
  level: info
  mode: development

